name: Deploy Vite React App to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build Vite app
      - name: Build Vite app
        run: npm run build

      # 5️⃣ Verify build output
      - name: Verify build output
        run: test -f dist/index.html

      # 6️⃣ Setup SSH Agent
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 7️⃣ Add EC2 host to known_hosts
      - name: Add EC2 to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 8️⃣ Deploy to EC2 via rsync
      - name: Deploy to EC2
        run: rsync -avz --delete dist/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/var/www/html/

      # 9️⃣ Fix permissions on EC2
      - name: Fix permissions
        run: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "sudo chown -R www-data:www-data /var/www/html && sudo chmod -R 755 /var/www/html"
